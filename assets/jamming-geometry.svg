<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d">
  <title id="t">Jamming geometry: who is closer to the victim receiver wins</title>
  <desc id="d">A drone's uplink receiver hears its pilot at 3 km and a jammer at 1 km. At the drone the wanted signal is -87.6 dBm and the jamming is -54.1 dBm, a J/S of 33.5 dB. The pilot would have to be within about 200 m to burn through.</desc>
  <style>
    .display { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -0.01em; }
    .sans { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .s { fill: #0B2545; animation: s 5s linear infinite; }
    .s2 { animation-delay: 1.66s; } .s3 { animation-delay: 3.33s; }
    @keyframes s { 0% { transform: translateX(0); opacity: .9; } 100% { transform: translateX(540px); opacity: .15; } }
    .j { fill: #8A6A1F; animation: j 1.8s linear infinite; }
    .j2 { animation-delay: .9s; }
    @keyframes j { 0% { transform: translateX(0); opacity: .95; } 100% { transform: translateX(-170px); opacity: .6; } }
    .ring { animation: ring 5s ease-in-out infinite; }
    @keyframes ring { 0%, 100% { stroke-opacity: .5; } 50% { stroke-opacity: 1; } }
    .hit { fill: none; stroke: #8A6A1F; stroke-width: 1.5; transform-box: view-box; transform-origin: 700px 170px; animation: hit 1.8s ease-out infinite; }
    @keyframes hit { 0% { transform: scale(.4); opacity: .8; } 100% { transform: scale(1.4); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .hit { opacity: 0; } }
  </style>
  <rect width="1000" height="470" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="999" height="469" fill="none" stroke="#D8DEE6"/>
  <rect x="0" y="0" width="1000" height="3" fill="#0B2545"/>
  <text x="40" y="38" class="mono" font-size="12" letter-spacing="1.2" fill="#5F6B7C">FIGURE 2 · TO SCALE ALONG THE LINE · 2.4 GHz · FREE SPACE</text>
  <text x="40" y="64" class="display" font-size="22" font-weight="600" fill="#0E1726">Jamming geometry: who is closer to the victim receiver wins</text>

  <!-- dimension lines -->
  <g stroke="#5F6B7C" stroke-width="1">
    <line x1="100" y1="100" x2="700" y2="100"/><line x1="100" y1="94" x2="100" y2="106"/><line x1="700" y1="94" x2="700" y2="106"/>
    <line x1="700" y1="100" x2="900" y2="100"/><line x1="900" y1="94" x2="900" y2="106"/>
  </g>
  <rect x="376" y="90" width="48" height="20" fill="#FFFFFF"/><text x="400" y="104" text-anchor="middle" class="mono" font-size="12" fill="#3D4A5C">3 km</text>
  <rect x="776" y="90" width="48" height="20" fill="#FFFFFF"/><text x="800" y="104" text-anchor="middle" class="mono" font-size="12" fill="#3D4A5C">1 km</text>

  <line x1="140" y1="170" x2="860" y2="170" stroke="#D8DEE6" stroke-width="1.5"/>

  <!-- burn-through ring: 200 m = 40 px -->
  <circle class="ring" cx="700" cy="170" r="40" fill="#E9F2F2" stroke="#2F6F73" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle class="hit" cx="700" cy="170" r="30"/>

  <!-- pilot / GCS -->
  <rect x="72" y="150" width="56" height="40" rx="4" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.75"/>
  <circle cx="88" cy="170" r="6" fill="none" stroke="#0B2545" stroke-width="1.75"/>
  <circle cx="112" cy="170" r="6" fill="none" stroke="#0B2545" stroke-width="1.75"/>
  <line x1="120" y1="150" x2="126" y2="132" stroke="#0B2545" stroke-width="1.75"/>

  <!-- drone -->
  <g stroke="#0E1726" stroke-width="1.75" fill="#FFFFFF">
    <line x1="684" y1="154" x2="716" y2="186"/><line x1="716" y1="154" x2="684" y2="186"/>
    <circle cx="684" cy="154" r="7"/><circle cx="716" cy="154" r="7"/><circle cx="684" cy="186" r="7"/><circle cx="716" cy="186" r="7"/>
    <rect x="693" y="163" width="14" height="14" rx="2"/>
  </g>

  <!-- jammer -->
  <path d="M872 170 L940 146 L940 194 Z" fill="#F4EFE2" stroke="#8A6A1F" stroke-width="1.5"/>
  <rect x="872" y="152" width="40" height="36" rx="4" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1.75"/>
  <line x1="892" y1="152" x2="892" y2="132" stroke="#8A6A1F" stroke-width="1.75"/>

  <!-- travelling energy -->
  <circle class="s" cx="140" cy="170" r="5"/>
  <circle class="s s2" cx="140" cy="170" r="5"/>
  <circle class="s s3" cx="140" cy="170" r="5"/>
  <circle class="j" cx="868" cy="170" r="7"/>
  <circle class="j j2" cx="868" cy="170" r="7"/>

  <g class="sans" font-size="14" fill="#0E1726" text-anchor="middle">
    <text x="100" y="222">Pilot / GCS</text><text x="700" y="232">Drone uplink receiver</text><text x="900" y="222">C-UAS jammer</text>
  </g>
  <g class="mono" font-size="12" fill="#3D4A5C" text-anchor="middle">
    <text x="100" y="240">20 dBm · 2 dBi</text><text x="700" y="250">0 dBi · 20 MHz</text><text x="900" y="240">40 dBm · 12 dBi</text>
    <text x="900" y="256">over 80 MHz</text>
  </g>
  <text x="700" y="274" text-anchor="middle" class="mono" font-size="12" fill="#2F6F73">burn-through ring r ≈ 200 m</text>

  <!-- power at the drone -->
  <line x1="40" y1="298" x2="960" y2="298" stroke="#E7EBF0"/>
  <text x="40" y="324" class="mono" font-size="12" letter-spacing="1.2" fill="#5F6B7C">POWER AT THE DRONE (dBm, scale −100 to −40)</text>
  <g class="mono" font-size="12" fill="#5F6B7C" text-anchor="middle">
    <text x="200" y="440">−100</text><text x="400" y="440">−80</text><text x="600" y="440">−60</text><text x="800" y="440">−40</text>
  </g>
  <line x1="200" y1="340" x2="200" y2="424" stroke="#D8DEE6"/>
  <text x="188" y="358" text-anchor="end" class="sans" font-size="13" fill="#0E1726">Wanted S</text>
  <rect x="200" y="346" width="124" height="16" fill="#0B2545"/>
  <text x="332" y="359" class="mono" font-size="12" fill="#0B2545">−87.6</text>
  <text x="188" y="396" text-anchor="end" class="sans" font-size="13" fill="#0E1726">Jamming J</text>
  <rect x="200" y="384" width="459" height="16" fill="#8A6A1F"/>
  <text x="667" y="397" class="mono" font-size="12" fill="#8A6A1F">−54.1</text>
  <path d="M324 406 v6 h335 v-6" fill="none" stroke="#0E1726" stroke-width="1.25"/>
  <text x="491" y="428" text-anchor="middle" class="mono" font-size="12" fill="#0E1726">J/S = 33.5 dB</text>
  <g class="mono" font-size="12" fill="#3D4A5C">
    <text x="730" y="350">(52 − 22)</text>
    <text x="730" y="368">+ 20 log(3/1) = +9.5</text>
    <text x="730" y="386">+ 10 log(20/80) = −6.0</text>
    <text x="730" y="404" fill="#0E1726">= 33.5 dB</text>
  </g>
  <text x="40" y="460" class="sans" font-size="12" fill="#5F6B7C">Assumes the link fails above 10 dB J/S (illustrative): 23.5 dB spare is a distance factor of 15, so the jammer could stand off about 15 km with line of sight.</text>
</svg>
